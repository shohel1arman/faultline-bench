# Small open VLMs that fit one 6 GB GPU in 4-bit (RTX 2060, no bfloat16).
# All models use the same precision and decoding so rows are comparable.
# Model ids were checked on the Hugging Face model pages on 2026-10-15.

[defaults]
quant = "nf4"        # 4-bit NF4 weights, float16 compute
dtype = "float16"
max_side = 672       # images are downscaled so the longer side is at most this

[models.qwen25vl-3b]
hf_id = "Qwen/Qwen2.5-VL-3B-Instruct"

[models.qwen3vl-4b]
hf_id = "Qwen/Qwen3-VL-4B-Instruct"

[models.internvl3-2b]
hf_id = "OpenGVLab/InternVL3-2B-hf"

[models.smolvlm2-2b]
hf_id = "HuggingFaceTB/SmolVLM2-2.2B-Instruct"
