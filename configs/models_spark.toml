# NVIDIA DGX Spark profile (GB10, 128 GB unified memory): every reported model runs here,
# in bfloat16 without quantisation, with the same image size as every other profile.
# Outputs go to outputs/spark/<model>/ (scripts/spark/queue.sh passes --out-root).
# Approximate bfloat16 weights: 2-4B ~4-9 GB, 7-8B ~16-18 GB, 30B-A3B ~62 GB, 32B ~66 GB.
# A model's rows in the paper come from one profile only; never mix profiles for one model.

[defaults]
quant = "none"
dtype = "bfloat16"
max_side = 672

# The four small models also ran on the Mac in float16; that run is the cross-platform check.
# Listed in run order (scripts/spark/queue.sh): smallest first, the 32B models last so they
# can be dropped if time runs out. Families: InternVL3 2B/8B; Qwen3-VL 2B/4B/8B/32B and
# 30B-A3B (mixture of experts); Qwen2.5-VL 3B/7B/32B; SmolVLM2 2.2B.

[models.internvl3-2b]
hf_id = "OpenGVLab/InternVL3-2B-hf"

[models.qwen3vl-2b]
hf_id = "Qwen/Qwen3-VL-2B-Instruct"

[models.qwen25vl-3b]
hf_id = "Qwen/Qwen2.5-VL-3B-Instruct"

[models.qwen3vl-4b]
hf_id = "Qwen/Qwen3-VL-4B-Instruct"

[models.smolvlm2-2b]
hf_id = "HuggingFaceTB/SmolVLM2-2.2B-Instruct"

[models.qwen25vl-7b]
hf_id = "Qwen/Qwen2.5-VL-7B-Instruct"

[models.internvl3-8b]
hf_id = "OpenGVLab/InternVL3-8B-hf"

[models.qwen3vl-8b]
hf_id = "Qwen/Qwen3-VL-8B-Instruct"

[models.qwen3vl-30b-a3b]
hf_id = "Qwen/Qwen3-VL-30B-A3B-Instruct"

[models.qwen3vl-32b]
hf_id = "Qwen/Qwen3-VL-32B-Instruct"

[models.qwen25vl-32b]
hf_id = "Qwen/Qwen2.5-VL-32B-Instruct"
