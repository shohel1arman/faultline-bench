[project]
name = "faultline"
version = "0.1.0"
description = "Benchmark for cross-modal conflict detection, resolution and attribution in vision-language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
eval = [
    "torch>=2.6; sys_platform != 'darwin'",
    "torch>=2.6,<2.15; sys_platform == 'darwin'",
    "torchvision",
    "transformers>=4.57",
    "accelerate",
    "bitsandbytes; sys_platform != 'darwin'",
    "pillow",
    "num2words",
]
analysis = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

# PyPI only has CPU builds of torch for Windows; take torch from the PyTorch CUDA 13.0 index.
# The Linux cu130 build includes sm_75 (RTX 20-series); check on Windows with torch.cuda.get_arch_list().
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["faultline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
